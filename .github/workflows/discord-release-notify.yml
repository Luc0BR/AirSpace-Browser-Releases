name: Notificar Discord sobre nova release

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem para o Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const release = context.payload.release;

            const title = release.prerelease
              ? "AirSpace atualizado (teste/bugfix)"
              : "AirSpace foi atualizado!";

            const color = release.prerelease ? 15105570 : 3066993;

            const notes = release.body && release.body.trim().length > 0
              ? release.body.substring(0, 1000)
              : "Sem notas de versao desta vez.";

            const payload = {
              embeds: [
                {
                  title: title,
                  description: "**Versao:** " + release.tag_name + "\n\n" + notes,
                  url: release.html_url,
                  color: color,
                  fields: [
                    {
                      name: "Download",
                      value: "[Clique aqui para baixar](" + release.html_url + ")"
                    }
                  ]
                }
              ]
            };

            const response = await fetch(process.env.DISCORD_WEBHOOK_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              const text = await response.text();
              core.setFailed("Discord respondeu com erro: " + response.status + " - " + text);
            }
